name: tennis-analysis
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # ultralytics 8.1.x requires Python <= 3.11
  - python=3.10
  - pip

  # prefer conda packages on Windows to avoid source builds
  - numpy=1.26.4
  - pandas=1.5.3
  - matplotlib=3.8.3
  - opencv=4.9.*

  # PyTorch + CUDA 11.8 (GPU). If you want CPU-only, see README for the alternative.
  - pytorch=2.2.1
  - torchvision=0.17.1
  - torchaudio=2.2.1
  - pytorch-cuda=11.8

  - pip:
      - ultralytics==8.1.29
      - accelerate==0.28.0
      - transformers==4.38.2
      - pandas-datareader==0.10.0

